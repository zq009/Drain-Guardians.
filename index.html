<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CanteenConnect</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Babel (transpiles JSX in the browser) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono&display=swap');

    * { font-family: 'DM Sans', sans-serif; }
    .mono { font-family: 'DM Mono', monospace; }

    :root {
      --emerald: #059669;
      --emerald-light: #d1fae5;
      --slate-bg: #f8fafc;
    }

    body { background: var(--slate-bg); margin: 0; }

    .card-hover {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card-hover:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(5,150,105,0.15);
    }

    .star-btn { transition: transform 0.1s; }
    .star-btn:hover { transform: scale(1.25); }

    .role-pill {
      transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
    }

    .bar-fill {
      transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
    }

    .modal-backdrop {
      animation: fadeIn 0.18s ease;
    }
    .modal-box {
      animation: slideUp 0.22s cubic-bezier(0.4,0,0.2,1);
    }

    @keyframes fadeIn {
      from { opacity: 0; } to { opacity: 1; }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .pulse-dot {
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity:1; } 50% { opacity:0.4; }
    }

    /* custom scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 3px; }
  </style>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            emerald: {
              50:'#ecfdf5', 100:'#d1fae5', 200:'#a7f3d0',
              300:'#6ee7b7', 400:'#34d399', 500:'#10b981',
              600:'#059669', 700:'#047857', 800:'#065f46', 900:'#064e3b'
            }
          }
        }
      }
    }
  </script>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ─── helpers ─────────────────────────────────────────────────── */
const Icon = ({ name, size=18, className="" }) => {
  const ref = useRef();
  useEffect(() => {
    if (lucide && lucide[toPascal(name)]) {
      const el = lucide.createElement(lucide[toPascal(name)]);
      el.setAttribute('width', size);
      el.setAttribute('height', size);
      el.setAttribute('stroke-width', '1.8');
      if (ref.current) {
        ref.current.innerHTML = '';
        ref.current.appendChild(el);
      }
    }
  }, [name, size]);
  return <span ref={ref} className={`inline-flex items-center ${className}`}/>;
};

function toPascal(str) {
  return str.split('-').map(s => s.charAt(0).toUpperCase()+s.slice(1)).join('');
}

function nutriScore(cal, fat) {
  if (cal < 400 && fat < 10) return { grade:'A', color:'bg-emerald-500', text:'Excellent' };
  if (cal < 650 && fat < 20) return { grade:'B', color:'bg-yellow-400', text:'Good' };
  return { grade:'C', color:'bg-red-400', text:'Moderate' };
}

function starRating(score, count) {
  const s = count ? (score/count).toFixed(1) : '—';
  return s;
}

/* ─── seed data ────────────────────────────────────────────────── */
const SEED = [
  { id:1, name:'Grilled Chicken Rice', price:5.50, category:'Main', cal:520, protein:38, carbs:55, fat:10,
    allergens:['Gluten'], freshVotes:8, lowVotes:1, discount:false,
    reviews:[{ stars:5, text:'Super fresh today!', photo:null }] },
  { id:2, name:'Veggie Pasta', price:4.20, category:'Main', cal:410, protein:14, carbs:72, fat:8,
    allergens:['Gluten','Dairy'], freshVotes:5, lowVotes:3, discount:true,
    reviews:[{ stars:4, text:'Tasty but a bit salty.', photo:null }] },
  { id:3, name:'Tuna Sandwich', price:3.80, category:'Snack', cal:340, protein:22, carbs:38, fat:9,
    allergens:['Gluten'], freshVotes:12, lowVotes:0, discount:false,
    reviews:[] },
  { id:4, name:'Fruit Salad', price:2.50, category:'Side', cal:150, protein:2, carbs:36, fat:1,
    allergens:[], freshVotes:20, lowVotes:0, discount:false,
    reviews:[{ stars:5, text:'Love this every day!', photo:null }] },
];

/* ═══════════════════════════════════════════════════════════════ */
/*  MAIN APP                                                       */
/* ═══════════════════════════════════════════════════════════════ */
function App() {
  const [role, setRole] = useState('student');   // 'staff' | 'student'
  const [meals, setMeals] = useState(SEED);

  const updateMeal = (id, patch) =>
    setMeals(m => m.map(x => x.id===id ? { ...x, ...patch } : x));

  const addMeal = (meal) =>
    setMeals(m => [...m, { ...meal, id: Date.now(), freshVotes:0, lowVotes:0, discount:false, reviews:[] }]);

  return (
    <div className="min-h-screen bg-slate-50">
      {/* ── Header ── */}
      <header className="bg-white border-b border-slate-100 sticky top-0 z-40 shadow-sm">
        <div className="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
          <div className="flex items-center gap-2">
            <div className="w-8 h-8 bg-emerald-600 rounded-xl flex items-center justify-center">
              <Icon name="utensils" size={16} className="text-white [&_svg]:stroke-white"/>
            </div>
            <span className="text-lg font-700 tracking-tight text-slate-800 font-bold">
              Canteen<span className="text-emerald-600">Connect</span>
            </span>
          </div>

          {/* Role switcher */}
          <div className="flex bg-slate-100 rounded-2xl p-1 gap-1">
            {['student','staff'].map(r => (
              <button key={r}
                onClick={() => setRole(r)}
                className={`role-pill px-4 py-1.5 rounded-xl text-sm font-semibold capitalize
                  ${role===r
                    ? 'bg-emerald-600 text-white shadow-sm'
                    : 'text-slate-500 hover:text-slate-700'}`}>
                {r==='staff' ? '👩‍🍳 Staff' : '🎒 Student'}
              </button>
            ))}
          </div>
        </div>
      </header>

      <main className="max-w-5xl mx-auto px-4 py-6">
        {role === 'staff'
          ? <StaffDashboard meals={meals} addMeal={addMeal} updateMeal={updateMeal}/>
          : <StudentView    meals={meals} updateMeal={updateMeal}/>
        }
      </main>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════ */
/*  STAFF DASHBOARD                                                */
/* ═══════════════════════════════════════════════════════════════ */
const ALLERGEN_LIST = ['Nuts','Dairy','Gluten','Egg','Soy','Shellfish','Fish'];
const CATEGORIES    = ['Main','Snack','Side','Drink','Dessert'];

function StaffDashboard({ meals, addMeal, updateMeal }) {
  const blank = { name:'', price:'', category:'Main', cal:'', protein:'', carbs:'', fat:'', allergens:[] };
  const [form, setForm] = useState(blank);
  const [saved, setSaved] = useState(false);
  const [tab, setTab] = useState('add');   // 'add' | 'feedback' | 'menu'

  function handleAllergen(a) {
    setForm(f => ({
      ...f,
      allergens: f.allergens.includes(a) ? f.allergens.filter(x=>x!==a) : [...f.allergens, a]
    }));
  }

  function handleSubmit() {
    if (!form.name || !form.price) return;
    addMeal({
      name: form.name,
      price: parseFloat(form.price),
      category: form.category,
      cal: parseInt(form.cal)||0,
      protein: parseInt(form.protein)||0,
      carbs: parseInt(form.carbs)||0,
      fat: parseInt(form.fat)||0,
      allergens: form.allergens,
    });
    setForm(blank);
    setSaved(true);
    setTimeout(() => setSaved(false), 2500);
  }

  const allReviews = meals.flatMap(m => m.reviews.map(r => ({ ...r, meal: m.name })));
  const avgSat = allReviews.length
    ? (allReviews.reduce((s,r)=>s+r.stars,0)/allReviews.length).toFixed(1)
    : '—';

  return (
    <div>
      <div className="flex items-center gap-3 mb-5">
        <div>
          <h1 className="text-2xl font-bold text-slate-800">Staff Dashboard</h1>
          <p className="text-sm text-slate-400">Manage menu items and view student feedback</p>
        </div>
      </div>

      {/* Tab nav */}
      <div className="flex gap-2 mb-6 border-b border-slate-200">
        {[['add','plus-circle','Add Meal'],['menu','list','Menu Items'],['feedback','message-circle','Feedback']].map(([id,icon,label]) => (
          <button key={id} onClick={()=>setTab(id)}
            className={`flex items-center gap-1.5 px-4 py-2.5 text-sm font-semibold border-b-2 transition-colors
              ${tab===id ? 'border-emerald-600 text-emerald-700' : 'border-transparent text-slate-400 hover:text-slate-600'}`}>
            <Icon name={icon} size={15}/> {label}
          </button>
        ))}
      </div>

      {/* ── ADD MEAL TAB ── */}
      {tab==='add' && (
        <div className="grid md:grid-cols-2 gap-5">
          {/* Basic info */}
          <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
            <h2 className="font-semibold text-slate-700 mb-4 flex items-center gap-2">
              <Icon name="clipboard-list" size={16} className="text-emerald-600"/> Basic Info
            </h2>
            <div className="space-y-3">
              <div>
                <label className="text-xs font-semibold text-slate-500 uppercase tracking-wide">Meal Name *</label>
                <input value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))}
                  placeholder="e.g. Grilled Salmon"
                  className="mt-1 w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-400"/>
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-xs font-semibold text-slate-500 uppercase tracking-wide">Price (RM) *</label>
                  <input type="number" step="0.10" min="0" value={form.price} onChange={e=>setForm(f=>({...f,price:e.target.value}))}
                    placeholder="0.00"
                    className="mt-1 w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-400"/>
                </div>
                <div>
                  <label className="text-xs font-semibold text-slate-500 uppercase tracking-wide">Category</label>
                  <select value={form.category} onChange={e=>setForm(f=>({...f,category:e.target.value}))}
                    className="mt-1 w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-400 bg-white">
                    {CATEGORIES.map(c=><option key={c}>{c}</option>)}
                  </select>
                </div>
              </div>
            </div>
          </div>

          {/* Nutrition */}
          <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
            <h2 className="font-semibold text-slate-700 mb-4 flex items-center gap-2">
              <Icon name="activity" size={16} className="text-emerald-600"/> Nutrition
            </h2>
            <div className="grid grid-cols-2 gap-3">
              {[['cal','Calories (kcal)'],['protein','Protein (g)'],['carbs','Carbs (g)'],['fat','Fat (g)']].map(([k,label])=>(
                <div key={k}>
                  <label className="text-xs font-semibold text-slate-500 uppercase tracking-wide">{label}</label>
                  <input type="number" min="0" value={form[k]} onChange={e=>setForm(f=>({...f,[k]:e.target.value}))}
                    placeholder="0"
                    className="mt-1 w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-400"/>
                </div>
              ))}
            </div>
          </div>

          {/* Allergens */}
          <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 md:col-span-2">
            <h2 className="font-semibold text-slate-700 mb-4 flex items-center gap-2">
              <Icon name="shield-alert" size={16} className="text-emerald-600"/> Allergen Checklist
            </h2>
            <div className="flex flex-wrap gap-2">
              {ALLERGEN_LIST.map(a => (
                <label key={a} className={`flex items-center gap-2 px-4 py-2 rounded-xl border cursor-pointer text-sm font-medium transition-all
                  ${form.allergens.includes(a)
                    ? 'bg-red-50 border-red-300 text-red-700'
                    : 'bg-slate-50 border-slate-200 text-slate-600 hover:border-slate-300'}`}>
                  <input type="checkbox" className="sr-only"
                    checked={form.allergens.includes(a)}
                    onChange={()=>handleAllergen(a)}/>
                  {form.allergens.includes(a) ? '⚠️' : '○'} {a}
                </label>
              ))}
            </div>

            <button onClick={handleSubmit}
              className="mt-5 w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl py-3 flex items-center justify-center gap-2 transition-colors">
              <Icon name="plus-circle" size={18} className="[&_svg]:stroke-white"/>
              Add to Menu
            </button>
            {saved && (
              <p className="mt-2 text-center text-emerald-600 text-sm font-semibold flex items-center justify-center gap-1">
                <Icon name="check-circle" size={15} className="text-emerald-500 [&_svg]:stroke-emerald-500"/>
                Meal added successfully!
              </p>
            )}
          </div>
        </div>
      )}

      {/* ── MENU ITEMS TAB ── */}
      {tab==='menu' && (
        <div className="space-y-3">
          {meals.map(m => (
            <div key={m.id} className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex items-center justify-between gap-4">
              <div>
                <div className="font-semibold text-slate-800">{m.name}
                  <span className="ml-2 text-xs font-mono text-slate-400 bg-slate-100 px-2 py-0.5 rounded-lg">{m.category}</span>
                  {m.discount && <span className="ml-2 text-xs bg-orange-100 text-orange-600 font-bold px-2 py-0.5 rounded-lg">🏷 EOD Discount</span>}
                </div>
                <div className="text-sm text-slate-500 mt-0.5">RM {m.price.toFixed(2)} · {m.cal} kcal</div>
              </div>
              <label className="flex items-center gap-2 text-sm font-medium text-slate-600 cursor-pointer select-none">
                <div onClick={()=>updateMeal(m.id,{discount:!m.discount})}
                  className={`w-10 h-5 rounded-full transition-colors relative ${m.discount ? 'bg-orange-400' : 'bg-slate-200'}`}>
                  <div className={`absolute top-0.5 w-4 h-4 bg-white rounded-full shadow transition-all ${m.discount ? 'left-5' : 'left-0.5'}`}/>
                </div>
                EOD Discount
              </label>
            </div>
          ))}
        </div>
      )}

      {/* ── FEEDBACK TAB ── */}
      {tab==='feedback' && (
        <div>
          {/* Summary */}
          <div className="grid grid-cols-3 gap-4 mb-6">
            {[
              { label:'Avg Satisfaction', value: avgSat==='—' ? '—' : `${avgSat}★`, icon:'star', color:'text-yellow-500'},
              { label:'Total Reviews',    value: allReviews.length, icon:'message-circle', color:'text-blue-500'},
              { label:'Menu Items',       value: meals.length, icon:'utensils', color:'text-emerald-600'},
            ].map(s=>(
              <div key={s.label} className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 text-center">
                <Icon name={s.icon} size={22} className={`${s.color} [&_svg]:stroke-current mx-auto mb-1`}/>
                <div className="text-2xl font-bold text-slate-800">{s.value}</div>
                <div className="text-xs text-slate-400 mt-0.5">{s.label}</div>
              </div>
            ))}
          </div>

          {/* Reviews */}
          <h2 className="font-semibold text-slate-700 mb-3">Student Reviews</h2>
          {allReviews.length === 0
            ? <p className="text-slate-400 text-sm">No reviews yet.</p>
            : allReviews.map((r,i)=>(
              <div key={i} className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 mb-3">
                <div className="flex items-center gap-2 mb-1">
                  <span className="text-yellow-400 text-sm">{'★'.repeat(r.stars)}{'☆'.repeat(5-r.stars)}</span>
                  <span className="text-xs text-slate-400">for <strong className="text-slate-600">{r.meal}</strong></span>
                </div>
                <p className="text-sm text-slate-600">{r.text || <em className="text-slate-300">No comment</em>}</p>
              </div>
            ))
          }
        </div>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════ */
/*  STUDENT VIEW                                                   */
/* ═══════════════════════════════════════════════════════════════ */
function StudentView({ meals, updateMeal }) {
  const [selected, setSelected] = useState(null);
  const [filter, setFilter]     = useState('All');
  const cats = ['All', ...new Set(meals.map(m=>m.category))];

  const visible = filter==='All' ? meals : meals.filter(m=>m.category===filter);

  return (
    <div>
      <div className="mb-5">
        <h1 className="text-2xl font-bold text-slate-800">Today's Menu</h1>
        <p className="text-sm text-slate-400">Tap any item to see nutrition details & leave a review</p>
      </div>

      {/* Filter pills */}
      <div className="flex gap-2 mb-5 flex-wrap">
        {cats.map(c=>(
          <button key={c} onClick={()=>setFilter(c)}
            className={`px-4 py-1.5 rounded-2xl text-sm font-semibold transition-all
              ${filter===c ? 'bg-emerald-600 text-white' : 'bg-white border border-slate-200 text-slate-500 hover:border-emerald-300'}`}>
            {c}
          </button>
        ))}
      </div>

      {/* Grid */}
      <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
        {visible.map(m=>(
          <MealCard key={m.id} meal={m} onOpen={()=>setSelected(m)} updateMeal={updateMeal}/>
        ))}
        {visible.length===0 && (
          <div className="col-span-3 text-center py-16 text-slate-300">
            <Icon name="utensils" size={48} className="mx-auto mb-2"/>
            <p>No items in this category yet.</p>
          </div>
        )}
      </div>

      {/* Modal */}
      {selected && (
        <MealModal
          meal={meals.find(m=>m.id===selected.id)}
          onClose={()=>setSelected(null)}
          updateMeal={updateMeal}
        />
      )}
    </div>
  );
}

/* ── Meal Card ─────────────────────────────────────────────────── */
function MealCard({ meal, onOpen, updateMeal }) {
  const score = nutriScore(meal.cal, meal.fat);
  const avgS  = meal.reviews.length
    ? (meal.reviews.reduce((s,r)=>s+r.stars,0)/meal.reviews.length).toFixed(1) : null;
  const totalFresh = meal.freshVotes + meal.lowVotes;

  return (
    <div onClick={onOpen}
      className="card-hover bg-white rounded-2xl p-4 shadow-sm border border-slate-100 cursor-pointer relative overflow-hidden">
      {meal.discount && (
        <div className="absolute top-3 right-3 bg-orange-100 text-orange-600 text-xs font-bold px-2 py-1 rounded-xl">
          🏷 EOD Deal
        </div>
      )}
      {/* Placeholder image area */}
      <div className="w-full h-32 bg-gradient-to-br from-emerald-50 to-slate-100 rounded-xl mb-3 flex items-center justify-center">
        <Icon name="utensils" size={36} className="text-emerald-300 [&_svg]:stroke-emerald-300"/>
      </div>

      <div className="flex items-start justify-between">
        <div>
          <h3 className="font-semibold text-slate-800 text-sm leading-tight">{meal.name}</h3>
          <span className="text-xs text-slate-400">{meal.category}</span>
        </div>
        <div className={`${score.color} text-white text-xs font-bold w-7 h-7 rounded-lg flex items-center justify-center flex-shrink-0`}>
          {score.grade}
        </div>
      </div>

      <div className="flex items-center justify-between mt-2">
        <span className="text-emerald-700 font-bold text-base">RM {meal.price.toFixed(2)}</span>
        {avgS && <span className="text-yellow-500 text-xs font-semibold">★ {avgS}</span>}
      </div>

      {/* Freshness votes */}
      <div className="flex gap-2 mt-3" onClick={e=>e.stopPropagation()}>
        <button onClick={()=>updateMeal(meal.id,{freshVotes:meal.freshVotes+1})}
          className="flex-1 flex items-center justify-center gap-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-semibold py-1.5 rounded-xl transition-colors">
          🔥 Fresh · {meal.freshVotes}
        </button>
        <button onClick={()=>updateMeal(meal.id,{lowVotes:meal.lowVotes+1})}
          className="flex-1 flex items-center justify-center gap-1 bg-red-50 hover:bg-red-100 text-red-600 text-xs font-semibold py-1.5 rounded-xl transition-colors">
          ⚠️ Low · {meal.lowVotes}
        </button>
      </div>
    </div>
  );
}

/* ── Meal Modal ────────────────────────────────────────────────── */
function MealModal({ meal, onClose, updateMeal }) {
  const [stars, setStars]   = useState(0);
  const [hover, setHover]   = useState(0);
  const [text, setText]     = useState('');
  const [photo, setPhoto]   = useState(null);
  const [submitted, setSubmitted] = useState(false);
  const fileRef = useRef();

  const score   = nutriScore(meal.cal, meal.fat);
  const total   = (meal.protein||0) + (meal.carbs||0) + (meal.fat||0);
  const macros  = [
    { label:'Protein', val:meal.protein, pct: total ? Math.round(meal.protein/total*100) : 0, color:'bg-emerald-400' },
    { label:'Carbs',   val:meal.carbs,   pct: total ? Math.round(meal.carbs/total*100)   : 0, color:'bg-yellow-400' },
    { label:'Fat',     val:meal.fat,     pct: total ? Math.round(meal.fat/total*100)     : 0, color:'bg-red-300'    },
  ];

  function handleReview() {
    if (!stars) return;
    updateMeal(meal.id, {
      reviews: [...meal.reviews, { stars, text, photo: photo ? photo.name : null }]
    });
    setSubmitted(true);
  }

  function handlePhoto(e) {
    if (e.target.files[0]) setPhoto(e.target.files[0]);
  }

  return (
    <div className="modal-backdrop fixed inset-0 bg-black/40 z-50 flex items-end sm:items-center justify-center p-4"
      onClick={onClose}>
      <div className="modal-box bg-white rounded-2xl w-full max-w-md max-h-[90vh] overflow-y-auto"
        onClick={e=>e.stopPropagation()}>
        {/* Header */}
        <div className="sticky top-0 bg-white border-b border-slate-100 px-5 py-4 flex items-center justify-between rounded-t-2xl z-10">
          <div>
            <h2 className="font-bold text-slate-800">{meal.name}</h2>
            <p className="text-xs text-slate-400">{meal.category} · RM {meal.price.toFixed(2)}</p>
          </div>
          <button onClick={onClose} className="w-8 h-8 bg-slate-100 hover:bg-slate-200 rounded-xl flex items-center justify-center transition-colors">
            <Icon name="x" size={16}/>
          </button>
        </div>

        <div className="p-5 space-y-5">
          {/* Allergen warning */}
          {meal.allergens.length > 0 && (
            <div className="bg-red-50 border border-red-200 rounded-xl px-4 py-3 flex items-center gap-2">
              <span className="text-lg">⚠️</span>
              <div>
                <p className="text-red-700 font-semibold text-sm">Allergen Alert</p>
                <p className="text-red-500 text-xs">Contains: {meal.allergens.join(', ')}</p>
              </div>
            </div>
          )}

          {/* NutriScore */}
          <div className="flex items-center gap-3">
            <div className={`${score.color} text-white font-extrabold text-2xl w-14 h-14 rounded-2xl flex items-center justify-center shadow-sm`}>
              {score.grade}
            </div>
            <div>
              <p className="font-semibold text-slate-800">Nutri-Score: {score.text}</p>
              <p className="text-xs text-slate-400">{meal.cal} kcal per serving</p>
            </div>
          </div>

          {/* Macro bars */}
          <div>
            <p className="text-sm font-semibold text-slate-700 mb-3">Macro Breakdown</p>
            <div className="space-y-2.5">
              {macros.map(m=>(
                <div key={m.label}>
                  <div className="flex justify-between text-xs text-slate-500 mb-1">
                    <span className="font-medium">{m.label}</span>
                    <span className="font-mono">{m.val}g · {m.pct}%</span>
                  </div>
                  <div className="bg-slate-100 rounded-full h-2.5 overflow-hidden">
                    <div className={`bar-fill ${m.color} h-full rounded-full`} style={{width:`${m.pct}%`}}/>
                  </div>
                </div>
              ))}
            </div>
          </div>

          {/* Freshness */}
          <div className="bg-slate-50 rounded-xl p-3 flex gap-2">
            <button onClick={()=>updateMeal(meal.id,{freshVotes:meal.freshVotes+1})}
              className="flex-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-semibold text-sm py-2 rounded-xl transition-colors">
              🔥 Freshly Cooked ({meal.freshVotes})
            </button>
            <button onClick={()=>updateMeal(meal.id,{lowVotes:meal.lowVotes+1})}
              className="flex-1 bg-red-50 hover:bg-red-100 text-red-600 font-semibold text-sm py-2 rounded-xl transition-colors">
              ⚠️ Running Low ({meal.lowVotes})
            </button>
          </div>

          {/* Reviews list */}
          {meal.reviews.length > 0 && (
            <div>
              <p className="text-sm font-semibold text-slate-700 mb-2">Reviews ({meal.reviews.length})</p>
              <div className="space-y-2">
                {meal.reviews.map((r,i)=>(
                  <div key={i} className="bg-slate-50 rounded-xl p-3">
                    <div className="text-yellow-400 text-xs mb-1">{'★'.repeat(r.stars)}{'☆'.repeat(5-r.stars)}</div>
                    {r.text && <p className="text-sm text-slate-600">{r.text}</p>}
                    {r.photo && <p className="text-xs text-slate-400 mt-1">📷 Photo: {r.photo}</p>}
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Leave a review */}
          {!submitted ? (
            <div className="border border-slate-200 rounded-2xl p-4">
              <p className="text-sm font-semibold text-slate-700 mb-3">Leave a Review</p>

              {/* Star selector */}
              <div className="flex gap-1 mb-3">
                {[1,2,3,4,5].map(s=>(
                  <button key={s} star-btn="true"
                    onClick={()=>setStars(s)}
                    onMouseEnter={()=>setHover(s)}
                    onMouseLeave={()=>setHover(0)}
                    className="star-btn text-2xl transition-transform">
                    {s<=(hover||stars) ? '★' : '☆'}
                  </button>
                ))}
              </div>

              <textarea value={text} onChange={e=>setText(e.target.value)}
                placeholder="Share your thoughts..."
                rows={2}
                className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm resize-none focus:outline-none focus:ring-2 focus:ring-emerald-400 mb-3"/>

              {/* Photo upload */}
              <div
                onClick={()=>fileRef.current.click()}
                className="border-2 border-dashed border-slate-200 hover:border-emerald-300 rounded-xl p-3 text-center cursor-pointer transition-colors mb-3">
                {photo
                  ? <p className="text-emerald-600 text-xs font-semibold">📷 {photo.name}</p>
                  : <p className="text-slate-400 text-xs">Click to attach a photo (optional)</p>
                }
                <input ref={fileRef} type="file" accept="image/*" className="sr-only" onChange={handlePhoto}/>
              </div>

              <button onClick={handleReview}
                disabled={!stars}
                className={`w-full py-2.5 rounded-xl text-sm font-semibold transition-all
                  ${stars ? 'bg-emerald-600 text-white hover:bg-emerald-700' : 'bg-slate-100 text-slate-300 cursor-not-allowed'}`}>
                Submit Review
              </button>
            </div>
          ) : (
            <div className="bg-emerald-50 border border-emerald-200 rounded-2xl p-4 text-center">
              <div className="text-2xl mb-1">🎉</div>
              <p className="font-semibold text-emerald-700">Thanks for your review!</p>
              <p className="text-xs text-emerald-500 mt-1">Your feedback helps other students.</p>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ─── Mount ───────────────────────────────────────────────────── */
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
